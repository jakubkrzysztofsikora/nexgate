name: nexgate-demo

services:
  demo-gateway:
    image: python:3.12-slim-bookworm@sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2
    command: ["python", "/app/mock_openai.py"]
    environment:
      # Validation may render this file without state; `make demo` supplies a
      # freshly generated key from .env.demo.
      DEMO_API_KEY: ${DEMO_API_KEY:-demo-validation-only}
      DEMO_PORT: "4010"
    ports:
      - "127.0.0.1:${DEMO_PORT:-4010}:4010"
    volumes:
      - ./demo/mock_openai.py:/app/mock_openai.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4010/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
