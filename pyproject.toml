[project]
name = "nexgate"
version = "0.1.0"
description = "LLM gateway fixtures and adapters with offline local validation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
authors = [{ name = "Jakub Sikora" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
    "a2a-sdk==1.1.2",
    "asyncpg==0.31.0",
    "boto3==1.40.62",
    "fastapi==0.139.0",
    "greenlet==3.3.2",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "sqlalchemy==2.0.51",
    "uvicorn==0.41.0",
]

[dependency-groups]
dev = [
  "PyYAML==6.0.3",
  "aiosqlite==0.22.1",
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
