[project]
name = "nexgate"
version = "0.1.0"
description = "LLM gateway fixtures and adapters with offline local validation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
authors = [{ name = "Jakub Sikora" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[dependency-groups]
dev = [
  "PyYAML==6.0.3",
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
