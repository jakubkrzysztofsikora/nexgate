  - name: reasoning-core gate (omp)
    why: "rc init --host omp; native-precommit.patch + host-precommit.patch; omp_bridge.py; doctor 0/4 (runtime unverified)"
    status: wired
  - name: Weryfikacja (suite + bramki)
    why: "omp-bielik-tasks.sh 12 zadań; v1 33% (9/12), v2 16%; cel ≥80% — FAIL"
