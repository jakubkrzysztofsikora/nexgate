name: Supply-chain scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          # The changed-file scope must be calculated against the event base.
          fetch-depth: 0

      - name: Install supply-core
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin/supply-core"
          mkdir -p "$(dirname "$bin")"
          primary="https://supply-core.tail5d39b4.ts.net/api/v1/download/supply-core-linux-x86_64"
          fallback="https://github.com/jakubkrzysztofsikora/supply-core/releases/latest/download/supply-core-linux-x86_64"
          if ! curl -fsSL --connect-timeout 5 --max-time 30 "$primary" -o "$bin"; then
            echo "official service unavailable; using GitHub release fallback"
            curl -fsSL --max-time 90 "$fallback" -o "$bin"
          fi
          chmod +x "$bin"
          "$bin" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Materialize changed pinning scope
        id: scope
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          scope="$RUNNER_TEMP/supply-core-scope"
          mkdir -p "$scope"
          while IFS= read -r scan_file; do
            case "$scan_file" in
              .github/workflows/*|Dockerfile*|*/Dockerfile*|compose.yml|*/compose.yml|docker-compose*.yml|*/docker-compose*.yml)
                mkdir -p "$scope/$(dirname "$scan_file")"
                cp -- "$scan_file" "$scope/$scan_file"
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA")
          echo "path=$scope" >> "$GITHUB_OUTPUT"

      - name: Scan workflow pinning
        run: supply-core scan-actions "${{ steps.scope.outputs.path }}" --annotations

      - name: Scan container image pinning
        if: always()
        run: supply-core scan-docker "${{ steps.scope.outputs.path }}"
