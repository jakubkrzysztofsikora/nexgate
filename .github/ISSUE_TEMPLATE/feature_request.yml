name: Feature request
description: Propose an opt-in, portable improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed outcome
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy and portability impact
      description: Explain credentials, networking, telemetry, and offline behavior.
    validations:
      required: true
